<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#efe6d6" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Admin · MyHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="atelier">
    <section class="gate" id="gate">
      <p class="stamp">Admin</p>
      <h1>Espace admin</h1>
      <p>Cours, devoirs, copies, étudiants et annonces. Même mot de passe que l’atelier.</p>
      <form id="admin-login">
        <label for="admin-pass">Mot de passe</label>
        <input
          id="admin-pass"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button class="btn btn-primary" type="submit">Entrer</button>
        <p class="gate-error" id="admin-error" hidden aria-live="polite"></p>
      </form>
    </section>

    <div id="desk" hidden>
      <button
        class="nav-toggle hub-toggle"
        type="button"
        id="hub-toggle"
        aria-controls="hub-side"
        aria-expanded="false"
        aria-label="Ouvrir le menu"
      >
        <span class="sr-only">Menu</span>
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>
      <div class="nav-backdrop" id="hub-backdrop" hidden></div>

      <aside class="hub-side" id="hub-side">
        <a class="mark" href="index.html">MyHub</a>
        <p class="hub-who">Administration</p>
        <nav class="hub-nav" aria-label="Espace admin">
          <button type="button" data-go="vue" aria-current="page">Vue</button>
          <button type="button" data-go="cours">Cours</button>
          <button type="button" data-go="devoirs">Devoirs</button>
          <button type="button" data-go="copies">Copies</button>
          <button type="button" data-go="etudiants">Étudiants</button>
          <button type="button" data-go="annonces">Annonces</button>
          <a href="atelier.html">Fréquentation</a>
        </nav>
        <button class="btn btn-ghost hub-exit" type="button" id="admin-logout">
          Sortir
        </button>
      </aside>

      <div class="hub-wrap">
        <header class="hub-head">
          <p class="stamp">Admin</p>
          <h1 id="hub-title">Vue</h1>
          <p id="hub-lead">Bootcamp, en coulisses.</p>
        </header>

        <main id="contenu" tabindex="-1">
          <section data-view="vue">
            <div class="stat-grid" id="admin-stats-grid"></div>
            <article class="hub-card">
              <h2>Copies à relire</h2>
              <div id="pending-list"></div>
            </article>
          </section>

          <section data-view="cours" hidden>
            <article class="hub-card">
              <h2 id="course-form-title">Créer un cours</h2>
              <form class="coords-form" id="course-form">
                <input id="course-id" name="id" type="hidden" />
                <div class="field">
                  <label for="course-title">Titre</label>
                  <input id="course-title" name="title" type="text" required />
                </div>
                <div class="field">
                  <label for="course-summary">Résumé</label>
                  <textarea id="course-summary" name="summary" rows="3"></textarea>
                </div>
                <div class="field">
                  <label for="course-support">Lien du support</label>
                  <input id="course-support" name="support" type="text" placeholder="supports/jour-1-apprenants.pdf" />
                </div>
                <div class="field">
                  <label for="course-meet">Lien Meet (optionnel)</label>
                  <input id="course-meet" name="meet" type="url" placeholder="https://" />
                </div>
                <label class="check-line">
                  <input id="course-published" name="published" type="checkbox" checked />
                  Visible pour les étudiants
                </label>
                <p class="form-error" id="course-error" hidden aria-live="polite"></p>
                <div class="hub-actions">
                  <button class="btn btn-primary" type="submit">Enregistrer le cours</button>
                  <button class="btn btn-ghost" type="button" id="course-reset">Nouveau cours</button>
                </div>
              </form>
            </article>
            <div id="course-list"></div>
          </section>

          <section data-view="devoirs" hidden>
            <article class="hub-card">
              <h2 id="work-form-title">Créer un devoir</h2>
              <form class="coords-form" id="work-form">
                <input id="work-id" name="id" type="hidden" />
                <div class="field">
                  <label for="work-course">Cours lié</label>
                  <select id="work-course" name="courseId" required></select>
                </div>
                <div class="field">
                  <label for="work-title">Titre du devoir</label>
                  <input id="work-title" name="title" type="text" required />
                </div>
                <div class="field">
                  <label for="work-brief">Consigne</label>
                  <textarea id="work-brief" name="brief" rows="4"></textarea>
                </div>
                <div class="field">
                  <label for="work-due">Date limite (optionnel)</label>
                  <input id="work-due" name="dueAt" type="date" />
                </div>
                <p class="form-error" id="work-error" hidden aria-live="polite"></p>
                <div class="hub-actions">
                  <button class="btn btn-primary" type="submit">Enregistrer le devoir</button>
                  <button class="btn btn-ghost" type="button" id="work-reset">Nouveau devoir</button>
                </div>
              </form>
            </article>
            <div id="work-list"></div>
          </section>

          <section data-view="copies" hidden>
            <div class="hub-toolbar">
              <label class="sr-only" for="copy-search">Rechercher une copie</label>
              <input id="copy-search" type="search" placeholder="Prénom, cours, devoir" />
            </div>
            <div id="copy-list"></div>
          </section>

          <section data-view="etudiants" hidden>
            <div id="student-list"></div>
          </section>

          <section data-view="annonces" hidden>
            <article class="hub-card">
              <h2>Publier une annonce</h2>
              <form class="coords-form" id="notice-form">
                <div class="field">
                  <label for="notice-title">Titre</label>
                  <input id="notice-title" name="title" type="text" required />
                </div>
                <div class="field">
                  <label for="notice-body">Message</label>
                  <textarea id="notice-body" name="body" rows="4" required></textarea>
                </div>
                <p class="form-error" id="notice-error" hidden aria-live="polite"></p>
                <button class="btn btn-primary" type="submit">Publier</button>
              </form>
            </article>
            <div id="notice-list"></div>
          </section>
        </main>
      </div>
    </div>

    <dialog class="full-dialog" id="copy-dialog" aria-labelledby="copy-dialog-title">
      <div class="full-dialog-inner copy-dialog-inner">
        <p class="stamp">Copie</p>
        <h2 id="copy-dialog-title">Rendu</h2>
        <p id="copy-dialog-meta"></p>
        <pre id="copy-dialog-code" class="copy-code"></pre>
        <iframe id="copy-dialog-frame" class="copy-frame" title="Aperçu du rendu" sandbox hidden></iframe>
        <p id="copy-dialog-link"></p>
        <form class="coords-form" id="review-form">
          <div class="field">
            <label for="review-grade">Note ou appréciation courte</label>
            <input id="review-grade" name="grade" type="text" placeholder="Bien, à retravailler…" />
          </div>
          <div class="field">
            <label for="review-feedback">Retour à l’étudiant</label>
            <textarea id="review-feedback" name="feedback" rows="4"></textarea>
          </div>
          <p class="form-error" id="review-error" hidden aria-live="polite"></p>
          <p class="form-ok" id="review-ok" hidden aria-live="polite"></p>
          <div class="hub-actions">
            <button class="btn btn-primary" type="submit">Envoyer le retour</button>
            <button class="btn btn-ghost" type="button" id="copy-download">Télécharger</button>
          </div>
        </form>
        <form method="dialog">
          <button class="btn btn-ghost" type="submit">Fermer</button>
        </form>
      </div>
    </dialog>

    <script src="studio-api.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
